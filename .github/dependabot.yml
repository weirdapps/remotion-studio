version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'weirdapps'
    assignees:
      - 'weirdapps'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    ignore:
      # TypeScript 7.x is not installable here: every published
      # @typescript-eslint release (8.67.0 at time of writing) declares
      # peer typescript ">=4.8.4 <6.1.0", so npm exits with ERESOLVE and the
      # Dependabot job dies with dependency_file_not_resolvable
      # (run 29731118406, 2026-07-20). PR #35 was closed with the decision to
      # stay on 6.x until a deliberate TS 7 migration. Drop this entry once
      # @typescript-eslint ships a peer range that admits 7.x. Minor and patch
      # updates, including security fixes on 6.x, are unaffected.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # First, and deliberately without update-types, so it also catches
      # majors. remotion, @remotion/bundler, @remotion/cli and
      # @remotion/renderer must move as one set: a split set installs fine and
      # type-checks fine, then fails at RENDER time, so CI stays green while
      # the artefact is broken. That is worse than a build break, because
      # nothing points at it. The production-dependencies group below is capped
      # at minor/patch, so a major would fall out of it entirely and Dependabot
      # would open one PR per package, which is exactly the split this prevents.
      remotion:
        patterns:
          - 'remotion'
          - '@remotion/*'
      # The same family again, because `applies-to` defaults to
      # 'version-updates' and a group without it never bundles SECURITY
      # updates: those arrive one PR per vulnerable package, which reintroduces
      # the split at the worst moment. Same reasoning as the vitest-security
      # group in telegram-bot's config.
      remotion-security:
        applies-to: security-updates
        patterns:
          - 'remotion'
          - '@remotion/*'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'remotion'
          - '@remotion/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci'
      include: 'scope'
